name: 'Process reminders'

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminder:
    permissions:
      issues: write  # for agrc/reminder-action to set reminders on issues
      pull-requests: write  # for agrc/reminder-action to set reminders on PRs
    runs-on: ubuntu-latest

    steps:
      - name: check reminders and notify
        uses: agrc/reminder-action@7655148211429c46835bd4aad94a43ab8bf096e2 # v1.0.20
